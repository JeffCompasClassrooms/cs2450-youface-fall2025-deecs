{% extends "base.html" %}

{% block content %}
<div class="row justify-content-md-center mb-4">
  <h3 class="card-title">{{ friend.username }}</h3>
  <form method="post" name="friend_name" action="{{ url_for('friends.unfriend') }}">
      <input type="hidden" name="friend_username" value="{{ friend.username }}">
      <button type="submit" class="btn btn-danger btn-sm">Remove Connection</button>
  </form>
</div>

<div class="row justify-content-md-center">
  <div class="col col-lg-8">
    <h2>Recent Intel</h2>
    {% for post in posts %}
    <div class="card bg-light">
      <div class="card-body">
        <h4 class="card-title">{{ post.profile.username }}</h4>
        <h6 class="card-subtitle mb-2 text-muted">{{ post.created_at|convert_time }}</h6>
        <p class="card-text">{{ post.content }}</p>
      </div>
    </div>
    {% endfor %}
    {% if not posts %}
    <p>...no intel transmitted...</p>
    {% endif %}
  </div>
</div>
{% endblock %}
