{% extends "base.html" %}

{% block content %}

<style>
  /* Override the global .btn style from youface.css which forces a blue background.
     This ensures the button is transparent with a green border, and muted green on hover.
  */
  .btn-signup-custom {
    background-color: transparent !important;
    color: #fff !important;
    border: 1px solid #28a745 !important; /* Bootstrap 'success' green */
  }
  
  .btn-signup-custom:hover, 
  .btn-signup-custom:focus {
    background-color: rgba(40, 167, 69, 0.6) !important; /* Muted green */
    border-color: #28a745 !important;
    color: #fff !important;
  }
</style>

<div class="row login-row" style="justify-content: center;">

  <div class="col-sm-6" style="max-width: 480px;">
    
    <!-- Centered Logo -->
    <img src="{{ url_for('static', filename='myspylogo.jpg') }}" class="login-logo" alt="mySpy Logo">

    <div class="card card-body bg-black login-card">
      <form method="post" action="{{ url_for('auth.signup') }}">
        <fieldset>
          <legend>New Agent Registration</legend>
          <hr />
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" name="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" name="password" required>
          </div>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" class="form-control" name="username" required>
          </div>
           <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" class="form-control" name="first_name" required>
          </div>
           <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" class="form-control" name="last_name" required>
          </div>
          <div class="form-group mb-0 text-center">
            <!-- Applied custom class here -->
            <input class="btn btn-signup-custom" type="submit" name="type" value="Create Account">
          </div>
        </fieldset>
      </form>
    </div>

    <!-- Link back to Login -->
    <div class="text-center mt-3 mb-5" style="padding-bottom: 3rem;">
      <a href="{{ url_for('auth.login_screen') }}" style="color: #00ffff; text-decoration: none;">
        Already have an account? <span style="text-decoration: underline;">Login</span>
      </a>
    </div>

  </div>

</div>
{% endblock %}
